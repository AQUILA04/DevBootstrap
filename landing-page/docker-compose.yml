services:
  stackpilot-landing:
    build: .
    image: stackpilot-landing:latest
    container_name: stackpilot-landing
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.stackpilot-landing.rule=Host(`${LANDING_HOST:-stackpilot.optimizesolux.com}`)
      - traefik.http.routers.stackpilot-landing.entrypoints=websecure
      - traefik.http.routers.stackpilot-landing.tls=true
      - traefik.http.routers.stackpilot-landing.tls.certresolver=le
      - traefik.http.services.stackpilot-landing.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
