name: Build StackPilot

on:
  push:
    branches: [main, master, cursor/fix-cloud-env]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    name: Build EXE + MSI
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      product_version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read product metadata
        id: meta
        shell: pwsh
        run: |
          . .\branding.ps1
          [xml]$props = Get-Content .\Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.ProductVersion
          if ($version -ne $ProductVersion) {
            throw "Version drift: props=$version branding=$ProductVersion"
          }
          $vj = Get-Content .\version.json -Raw | ConvertFrom-Json
          if ($vj.version -ne $version) {
            throw "Version drift: version.json=$($vj.version) props=$version"
          }
          $isRelease = $false
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expected = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Release tag '$($env:GITHUB_REF_NAME)' must exactly match product version tag '$expected'."
            }
            $isRelease = $true
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$isRelease" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Product version $version (release=$isRelease)"

      - name: Validate packaging metadata
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\validate-packaging.ps1

      - name: Publish unsigned EXE
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -Phase PublishExe -SkipZip -SkipMsi -SkipSign

      - name: Azure login (release signing, OIDC)
        if: steps.meta.outputs.is_release == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign EXE (Azure Artifact Signing)
        if: steps.meta.outputs.is_release == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\StackPilot\StackPilot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Optional local PFX sign EXE (non-release / compatible fallback)
        if: steps.meta.outputs.is_release != 'true'
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -Phase SignExe -SkipZip -SkipMsi

      - name: Build MSI (packages published EXE)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -Phase BuildMsi -SkipZip -SkipSign

      - name: Upload WiX build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-build-log
          path: |
            dist/msi/wix-build.log
            dist/msi/wix.binlog
          if-no-files-found: warn

      - name: Sign MSI (Azure Artifact Signing)
        if: steps.meta.outputs.is_release == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Optional local PFX sign MSI (non-release)
        if: steps.meta.outputs.is_release != 'true'
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -Phase SignMsi -SkipZip

      - name: Package versioned ZIP + SHA256SUMS
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -Phase Package

      - name: Verify Authenticode (release)
        if: steps.meta.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $exe = ".\dist\StackPilot\StackPilot.exe"
          $msi = ".\dist\msi\StackPilot-$version-x64.msi"
          foreach ($path in @($exe, $msi)) {
            $sig = Get-AuthenticodeSignature -FilePath $path
            Write-Host ("{0}: Status={1} Publisher={2}" -f $path, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne "Valid") {
              throw "Authenticode invalid for $path : $($sig.Status) $($sig.StatusMessage)"
            }
            if (-not $sig.SignerCertificate) {
              throw "Missing signer certificate for $path"
            }
            Write-Host "Publisher OK: $($sig.SignerCertificate.Subject)"
          }

      - name: Silent MSI install + uninstall smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $msi = (Resolve-Path ".\dist\msi\StackPilot-$version-x64.msi").Path
          $logInstall = Join-Path $env:RUNNER_TEMP "stackpilot-msi-install.log"
          $logUninstall = Join-Path $env:RUNNER_TEMP "stackpilot-msi-uninstall.log"
          $msiInfo = Get-Item $msi
          Write-Host ("Silent install {0} ({1:N0} bytes)" -f $msi, $msiInfo.Length)
          if ($msiInfo.Length -lt 1MB) {
            throw "MSI looks too small to contain the self-contained EXE: $($msiInfo.Length) bytes"
          }
          $installArgs = "/i `"$msi`" /qn /norestart ALLUSERS=1 /l*v `"$logInstall`""
          $p = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $installArgs -Wait -PassThru
          Write-Host "msiexec install exit=$($p.ExitCode)"
          if ($p.ExitCode -notin @(0, 3010)) {
            if (Test-Path $logInstall) { Get-Content $logInstall -Tail 120 }
            throw "MSI install failed with code $($p.ExitCode)"
          }
          $exe = Join-Path ${env:ProgramFiles} "OptimizeSolux\StackPilot\StackPilot.exe"
          $catalog = Join-Path ${env:ProgramFiles} "OptimizeSolux\StackPilot\catalog.json"
          if (-not (Test-Path $exe)) {
            Write-Host "Install tree:"
            Get-ChildItem (Join-Path ${env:ProgramFiles} "OptimizeSolux") -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            if (Test-Path $logInstall) { Get-Content $logInstall -Tail 120 }
            throw "Installed EXE missing: $exe"
          }
          if (-not (Test-Path $catalog)) { throw "Installed catalog.json missing: $catalog" }
          Write-Host "Install OK: $exe"
          Write-Host "Silent uninstall"
          $uninstallArgs = "/x `"$msi`" /qn /norestart /l*v `"$logUninstall`""
          $u = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $uninstallArgs -Wait -PassThru
          Write-Host "msiexec uninstall exit=$($u.ExitCode)"
          if ($u.ExitCode -notin @(0, 3010)) {
            if (Test-Path $logUninstall) { Get-Content $logUninstall -Tail 120 }
            throw "MSI uninstall failed with code $($u.ExitCode)"
          }
          if (Test-Path $exe) {
            throw "EXE still present after uninstall: $exe"
          }
          Write-Host "Uninstall OK"

      - name: Upload StackPilot folder
        uses: actions/upload-artifact@v4
        with:
          name: StackPilot
          path: dist/StackPilot/
          if-no-files-found: error

      - name: Upload MSI + ZIP + checksums
        uses: actions/upload-artifact@v4
        with:
          name: StackPilot-installer
          path: |
            dist/msi/*.msi
            dist/StackPilot-*-x64.zip
            dist/StackPilot-*-SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: StackPilot-installer
          path: release-assets

      - name: Create immutable versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.msi
            release-assets/**/*.zip
            release-assets/**/*SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
