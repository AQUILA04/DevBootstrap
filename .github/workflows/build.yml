name: Build StackPilot

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and validate MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check tag matches product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $props = [xml](Get-Content .\Directory.Build.props -Raw)
          $version = [string]$props.Project.PropertyGroup.StackPilotVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas a StackPilotVersion $version."
          }

      - name: Publish StackPilot
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1 -SkipMsi -SkipZip

      - name: Sign executable with Azure Artifact Signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist\StackPilot
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build MSI around signed executable
        shell: pwsh
        run: .\build.ps1 -MsiOnly -SkipZip

      - name: Sign MSI with Azure Artifact Signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ secrets.EXPECTED_PUBLISHER }}
        run: |
          if ($env:EXPECTED_PUBLISHER) {
            .\scripts\verify-release.ps1 -RequireSignature -ExpectedPublisher $env:EXPECTED_PUBLISHER
          } else {
            .\scripts\verify-release.ps1 -RequireSignature
          }

      - name: Verify unsigned development build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: .\scripts\verify-release.ps1

      - name: Test silent MSI install and uninstall
        shell: pwsh
        run: |
          $props = [xml](Get-Content .\Directory.Build.props -Raw)
          $version = [string]$props.Project.PropertyGroup.StackPilotVersion
          $msi = Resolve-Path ".\dist\StackPilot-$version-x64.msi"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart"
          if ($install.ExitCode -ne 0) { throw "Installation MSI: $($install.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\StackPilot\StackPilot.exe")) {
            throw "StackPilot.exe absent de Program Files."
          }
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/x `"$msi`" /qn /norestart"
          if ($uninstall.ExitCode -ne 0) { throw "Desinstallation MSI: $($uninstall.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\StackPilot\StackPilot.exe") {
            throw "StackPilot.exe present apres desinstallation."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $props = [xml](Get-Content .\Directory.Build.props -Raw)
          $version = [string]$props.Project.PropertyGroup.StackPilotVersion
          Compress-Archive -Path .\dist\StackPilot -DestinationPath ".\dist\StackPilot-$version-x64.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StackPilot-release
          path: |
            dist/StackPilot-*-x64.msi
            dist/StackPilot-*-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: StackPilot-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
