name: Deploy StackPilot landing

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stackpilot-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure Contabo deploy secrets, then re-run."
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_LANDING_PATH: ${{ secrets.VPS_LANDING_PATH }}
          LANDING_HOST: ${{ secrets.LANDING_HOST }}
          LANDING_COMPOSE_PROJECT: ${{ secrets.LANDING_COMPOSE_PROJECT }}
        run: |
          REMOTE_PATH="${VPS_LANDING_PATH:-/opt/optimizesolux/stackpilot-landing}"
          PROJECT_NAME="${LANDING_COMPOSE_PROJECT:-stackpilot-landing}"
          HOST_NAME="${LANDING_HOST:-stackpilot.optimizesolux.com}"

          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_PATH}'"
          rsync -az --delete \
            --exclude '.git' \
            landing-page/ \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_PATH}/"

          ssh "${VPS_USER}@${VPS_HOST}" "\
            cd '${REMOTE_PATH}' && \
            export LANDING_HOST='${HOST_NAME}' && \
            docker compose --project-name '${PROJECT_NAME}' up -d --build"

      - name: Smoke check
        env:
          LANDING_HOST: ${{ secrets.LANDING_HOST }}
        run: |
          HOST_NAME="${LANDING_HOST:-stackpilot.optimizesolux.com}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "https://${HOST_NAME}/" >/dev/null; then
              echo "OK https://${HOST_NAME}/"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke check failed for https://${HOST_NAME}/"
          exit 1
